[package]
name = "replace-with-your-wasmer-username/taskflow-laravel-api"
version = "0.1.0"
description = "TaskFlow Laravel JSON API"

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app/" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]
