kind: wasmer.io/App.v0
owner: zagesh7
name: taskflow-laravel-api
package: .
capabilities:
  database:
    engine: mysql
jobs:
  - name: migrate-and-seed
    trigger: pre-deployment
    action:
      execute:
        command: bash
        cli_args:
          - -lc
          - php artisan migrate --seed --force
